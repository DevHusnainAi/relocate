<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Acme Admin</title>
  <style>
    body { font: 15px system-ui; max-width: 640px; margin: 40px auto; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    td { padding: 8px; border-bottom: 1px solid #ddd; }
    button { padding: 6px 12px; font: inherit; cursor: pointer; }
    input { padding: 8px; font: inherit; width: 60%; }
  </style>
</head>
<body>
  <!-- v2: testids renamed, "Delete" became "Remove", row ids replaced by data-id -->
  <h1>Team members</h1>
  <input type="search" placeholder="Search people" oninput="document.getElementById('query').textContent = this.value">
  <p>Query: <span id="query"></span></p>

  <table>
    <tr data-id="1"><td>Alpha</td><td><button class="btn-edit" onclick="edit('Alpha')">Edit</button></td></tr>
    <tr data-id="2"><td>Beta</td><td><button class="btn-edit" onclick="edit('Beta')">Edit</button></td></tr>
    <tr data-id="3"><td>Gamma</td><td><button class="btn-edit" onclick="edit('Gamma')">Edit</button></td></tr>
  </table>
  <p id="editing"></p>

  <button onclick="document.querySelector('tr[data-id=\'3\']').remove(); toast('User removed')">Remove</button>
  <button data-testid="settings-save" onclick="toast('Settings saved')">Save changes</button>
  <button onclick="toast('Cancelled')">Cancel</button>
  <p id="toast" role="status"></p>

  <script>
    const edit = name => document.getElementById('editing').textContent = 'Editing ' + name;
    const toast = msg => document.getElementById('toast').textContent = msg;
  </script>
</body>
</html>
